spring.application.name=OneStop

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/onestopdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080


groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=qwen/qwen3.8-27b


#jwt.secret=${JWT_SECRET}
jwt.secret=replace-this-with-a-long-random-secret-value-at-least-32-characters
jwt.expiration=900000


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
